<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AutoFiltros Pro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#0f1729;color:#e5e9f2;padding:20px;font-size:14px}
h1{font-size:22px;margin-bottom:4px}
.sub{color:#8b94a8;font-size:13px;margin-bottom:20px}
.bar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
input[type=text]{flex:1;min-width:200px;padding:10px 14px;background:#1d2436;border:1px solid #2a3247;border-radius:8px;color:#e5e9f2;font-size:14px}
input[type=text]:focus{outline:none;border-color:#6366f1}
button{padding:10px 16px;background:#6366f1;border:none;border-radius:8px;color:#fff;font-size:13px;cursor:pointer;font-weight:600;font-family:inherit}
button:hover{background:#4f46e5}
button.sec{background:#2a3247}
button.sec:hover{background:#3a4560}
button.danger{background:#ef4444}
button.danger:hover{background:#dc2626}
.tw{background:#151b2b;border:1px solid #2a3247;border-radius:12px;overflow:auto}
table{width:100%;border-collapse:collapse;min-width:900px}
th{background:#1d2436;padding:12px;text-align:left;font-size:11px;text-transform:uppercase;color:#8b94a8;font-weight:700;letter-spacing:.5px}
td{padding:12px;border-top:1px solid #2a3247;font-size:13px}
tr:hover td{background:#1d2436}
.veic{font-weight:600;color:#e5e9f2}
.code{display:inline-block;padding:3px 8px;background:#252d42;border:1px solid #2a3247;border-radius:5px;font-family:Consolas,monospace;font-size:12px;cursor:pointer;color:#e5e9f2}
.code:hover{border-color:#6366f1;color:#a5b4fc}
.code.eq{border-color:#6366f1}
.code em{color:#fbbf24;font-style:normal;font-size:10px;margin-left:2px}
.code.none{background:none;border:none;color:#5b6479;cursor:default}
.code.none:hover{color:#5b6479;border:none}
.modal{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;padding:20px;z-index:100}
.modal.show{display:flex}
.box{background:#151b2b;border:1px solid #2a3247;border-radius:14px;max-width:540px;width:100%;max-height:85vh;overflow:auto}
.head{padding:16px 20px;border-bottom:1px solid #2a3247;display:flex;justify-content:space-between;align-items:center}
.head h3{font-size:15px;color:#e5e9f2}
.head button{background:none;padding:4px 10px;color:#8b94a8;font-size:16px}
.head button:hover{color:#e5e9f2;background:#2a3247}
.body{padding:20px}
.field{margin-bottom:12px}
.field label{display:block;font-size:11px;text-transform:uppercase;color:#8b94a8;margin-bottom:5px;font-weight:700;letter-spacing:.5px}
.field input{width:100%;padding:9px 12px;background:#0f1729;border:1px solid #2a3247;border-radius:6px;color:#e5e9f2;font-size:13px;font-family:inherit}
.field input:focus{outline:none;border-color:#6366f1}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.item{padding:10px 12px;background:#1d2436;border-radius:6px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;font-size:13px}
.item .cat{font-size:10px;padding:2px 8px;background:#252d42;border-radius:4px;color:#8b94a8;font-weight:700}
.eqs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.eq{padding:8px 10px;background:#1d2436;border:1px solid #2a3247;border-radius:6px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-size:12px;gap:6px}
.eq:hover{background:#252d42;border-color:#6366f1}
.eq .brand{color:#8b94a8;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.eq .val{color:#a5b4fc;font-family:Consolas,monospace;font-weight:600}
.hint{color:#8b94a8;font-size:12px;margin-top:10px}
.sect{font-size:11px;text-transform:uppercase;color:#8b94a8;margin:16px 0 8px;font-weight:700;letter-spacing:.5px}
.toast{position:fixed;bottom:20px;right:20px;background:#10b981;color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;z-index:200;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.empty{padding:60px 20px;text-align:center;color:#8b94a8}
@media(max-width:600px){.two{grid-template-columns:1fr}.eqs{grid-template-columns:1fr}}
</style>
</head>

  <input type="file" id="fileImport" accept=".json" style="display:none">

var data = [];

function loadData(){
  try{
    var raw = localStorage.getItem(DATA_KEY);
    if(raw){ data = JSON.parse(raw); }
    else { data = JSON.parse(JSON.stringify(DEFAULT_DATA)); saveData(); }
  }catch(e){
    data = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
}

function saveData(){
  try{ localStorage.setItem(DATA_KEY, JSON.stringify(data)); }catch(e){}
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    if(c === '&') return '&amp;';
    if(c === '<') return '&lt;';
    if(c === '>') return '&gt;';
    if(c === '"') return '&quot;';
    return '&#39;';
  });
}

function norm(s){
  return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function getCross(code){
  var k = String(code || '').toUpperCase().replace(/\s+/g,'');
  if(CROSS[k]) return CROSS[k];
  var parts = k.split(/[\/,;]/);
  for(var i=0;i<parts.length;i++){
    var p = parts[i].trim();
    if(p && CROSS[p]) return CROSS[p];
  }
  return null;
}

function toast(msg){
  var el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function(){
    el.style.opacity = '0';
    el.style.transition = 'opacity .3s';
    setTimeout(function(){ el.remove(); }, 300);
  }, 2200);
}

function codeCell(code){
  if(!code || !code.trim()) return '<span class="code none">-</span>';
  var hasCross = getCross(code) ? true : false;
  var cls = hasCross ? 'code eq' : 'code';
  var star = hasCross ? '<em>equiv</em>' : '';
  return '<span class="' + cls + '" data-code="' + esc(code) + '">' + esc(code) + star + '</span>';
}

function renderTable(filter){
  var tbody = document.getElementById('tbody');
  var rows = data;
  if(filter && filter.trim()){
    var t = norm(filter);
    rows = [];
    for(var r=0;r<data.length;r++){
      var v = data[r];
      var hay = norm(v.veiculo + ' ' + v.oleo + ' ' + v.ar + ' ' + v.cabine + ' ' + v.combustivel + ' ' + v.cambio);
      if(hay.indexOf(t) >= 0) rows.push(v);
    }
  }
  
  if(rows.length === 0){
    tbody.innerHTML = '<tr><td colspan="7"><div class="empty">Nenhum veiculo encontrado</div></td></tr>';
    return;
  }
  
  var html = '';
  for(var i=0;i<rows.length;i++){
    var v = rows[i];
    html += '<tr>';
    html += '<td class="veic">' + esc(v.veiculo) + '</td>';
    html += '<td>' + codeCell(v.oleo) + '</td>';
    html += '<td>' + codeCell(v.ar) + '</td>';
    html += '<td>' + codeCell(v.cabine) + '</td>';
    html += '<td>' + codeCell(v.combustivel) + '</td>';
    html += '<td>' + codeCell(v.cambio) + '</td>';
    html += '<td><button class="sec" data-edit="' + v.id + '" style="padding:4px 8px;font-size:11px">Editar</button></td>';
    html += '</tr>';
  }
  tbody.innerHTML = html;
  
  var codes = tbody.querySelectorAll('.code[data-code]');
  for(var j=0;j<codes.length;j++) codes[j].addEventListener('click', onCodeClick);
  var edits = tbody.querySelectorAll('[data-edit]');
  for(var k=0;k<edits.length;k++) edits[k].addEventListener('click', onEditClick);
}

function onCodeClick(e){
  showModal(e.currentTarget.getAttribute('data-code'));
}

function onEditClick(e){
  openForm(e.currentTarget.getAttribute('data-edit'));
}

function showModal(code){
  document.getElementById('modalTitle').textContent = 'Filtro ' + code;
  
  var cross = getCross(code);
  var vehicles = [];
  for(var i=0;i<data.length;i++){
    var v = data[i];
    var all = [v.oleo,v.ar,v.cabine,v.combustivel,v.cambio].join(' ');
    if(all.indexOf(code) >= 0) vehicles.push(v);
  }
  
  var html = '';
  html += '<div style="margin-bottom:14px"><button class="sec" id="btnCopyCode" style="padding:6px 12px;font-size:12px">Copiar codigo</button></div>';
  
  html += '<div class="sect">Aplicacoes (' + vehicles.length + ')</div>';
  if(vehicles.length > 0){
    for(var x=0;x<vehicles.length;x++){
      html += '<div class="item"><span>' + esc(vehicles[x].veiculo) + '</span></div>';
    }
  } else {
    html += '<p style="color:#8b94a8;font-size:13px">Nenhuma aplicacao cadastrada.</p>';
  }
  
  if(cross){
    html += '<div class="sect">Equivalentes</div>';
    html += '<div class="eqs">';
    var brands = Object.keys(cross);
    for(var b=0;b<brands.length;b++){
      var brand = brands[b];
      var val = cross[brand];
      html += '<div class="eq" data-eq="' + esc(val) + '"><span class="brand">' + esc(brand) + '</span><span class="val">' + esc(val) + '</span></div>';
    }
    html += '</div>';
    html += '<p class="hint">Clique em um codigo para copiar.</p>';
  } else {
    html += '<p style="color:#8b94a8;font-size:12px;margin-top:16px">Sem equivalentes cadastradas para este codigo.</p>';
  }
  
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
  
  document.getElementById('btnCopyCode').addEventListener('click', function(){ copyText(code); });
  var eqs = document.querySelectorAll('.eq[data-eq]');
  for(var m=0;m<eqs.length;m++){
    eqs[m].addEventListener('click', function(ev){
      copyText(ev.currentTarget.getAttribute('data-eq'));
    });
  }
}

function openForm(id){
  var v = null;
  if(id){
    for(var i=0;i<data.length;i++){ if(data[i].id === id){ v = data[i]; break; } }
  }
  if(!v) v = {id:'n' + Date.now(), veiculo:'', oleo:'', ar:'', cabine:'', combustivel:'', cambio:''};
  
  document.getElementById('modalTitle').textContent = id ? 'Editar Veiculo' : 'Novo Veiculo';
  
  var html = '';
  html += '<div class="field"><label>Veiculo / Aplicacao *</label><input type="text" id="f-veiculo" value="' + esc(v.veiculo) + '"></div>';
  html += '<div class="two">';
  html += '<div class="field"><label>Oleo</label><input type="text" id="f-oleo" value="' + esc(v.oleo) + '"></div>';
  html += '<div class="field"><label>Ar</label><input type="text" id="f-ar" value="' + esc(v.ar) + '"></div>';
  html += '<div class="field"><label>Cabine</label><input type="text" id="f-cabine" value="' + esc(v.cabine) + '"></div>';
  html += '<div class="field"><label>Combustivel</label><input type="text" id="f-combustivel" value="' + esc(v.combustivel) + '"></div>';
  html += '</div>';
  html += '<div class="field"><label>Cambio</label><input type="text" id="f-cambio" value="' + esc(v.cambio) + '"></div>';
  html += '<div style="display:flex;gap:8px;margin-top:16px">';
  html += '<button id="btnSave">Salvar</button>';
  html += '<button class="sec" id="btnCancel">Cancelar</button>';
  if(id) html += '<button class="danger" style="margin-left:auto" id="btnDel">Excluir</button>';
  html += '</div>';
  
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('modal').classList.add('show');
  
  document.getElementById('btnSave').addEventListener('click', function(){ saveVehicle(v, id); });
  document.getElementById('btnCancel').addEventListener('click', closeModal);
  if(id) document.getElementById('btnDel').addEventListener('click', function(){ deleteVehicle(id); });
}

function saveVehicle(v, isEdit){
  var veic = document.getElementById('f-veiculo').value.trim();
  if(!veic){ toast('Informe o nome do veiculo'); return; }
  v.veiculo = veic;
  v.oleo = document.getElementById('f-oleo').value.trim();
  v.ar = document.getElementById('f-ar').value.trim();
  v.cabine = document.getElementById('f-cabine').value.trim();
  v.combustivel = document.getElementById('f-combustivel').value.trim();
  v.cambio = document.getElementById('f-cambio').value.trim();
  
  var idx = -1;
  for(var i=0;i<data.length;i++){ if(data[i].id === v.id){ idx = i; break; } }
  if(idx >= 0) data[idx] = v;
  else data.unshift(v);
  
  saveData();
  closeModal();
  renderTable(document.getElementById('search').value);
  toast(isEdit ? 'Atualizado' : 'Cadastrado');
}

function deleteVehicle(id){
  if(!confirm('Excluir este veiculo?')) return;
  var nd = [];
  for(var i=0;i<data.length;i++){ if(data[i].id !== id) nd.push(data[i]); }
  data = nd;
  saveData();
  closeModal();
  renderTable(document.getElementById('search').value);
  toast('Excluido');
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
}

function copyText(t){
  if(navigator.clipboard){
    navigator.clipboard.writeText(t).then(function(){ toast('Copiado: ' + t); }).catch(function(){ toast('Copiado: ' + t); });
  } else {
    toast('Copiado: ' + t);
  }
}

function exportData(){
  var blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'autofiltros-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exportado');
}

function importData(file){
  var reader = new FileReader();
  reader.onload = function(e){
    try{
      var parsed = JSON.parse(e.target.result);
      if(!Array.isArray(parsed)) throw new Error('formato invalido');
      data = parsed;
      saveData();
      renderTable('');
      toast('Importado: ' + parsed.length + ' veiculos');
    }catch(err){
      toast('Erro: ' + err.message);
    }
  };
  reader.readAsText(file);
}

document.addEventListener('DOMContentLoaded', function(){
  loadData();
  renderTable('');
  
  document.getElementById('search').addEventListener('input', function(e){
    renderTable(e.target.value);
  });
  document.getElementById('btnAdd').addEventListener('click', function(){ openForm(null); });
  document.getElementById('btnExport').addEventListener('click', exportData);
  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileImport').click();
  });
  document.getElementById('fileImport').addEventListener('change', function(e){
    if(e.target.files[0]) importData(e.target.files[0]);
    e.target.value = '';
  });
  document.getElementById('btnClose').addEventListener('click', closeModal);
  document.getElementById('modal').addEventListener('click', function(e){
    if(e.target.id === 'modal') closeModal();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape') closeModal();
  });
});
</script>
</body>
</html>
